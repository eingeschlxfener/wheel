<meta name="theme-color" content="#09090b">
<style>
:root{--bg:#f4f4f5;--fg:#09090b;--card:#fff;--mut:#71717a;--bd:#e4e4e7;--ac:#f43f5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090b;--fg:#fafafa;--card:#18181b;--mut:#a1a1aa;--bd:#27272a}}
:root[data-theme="dark"]{--bg:#09090b;--fg:#fafafa;--card:#18181b;--mut:#a1a1aa;--bd:#27272a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Avenir Next",system-ui,sans-serif;min-height:100%;-webkit-tap-highlight-color:transparent}
main{max-width:460px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
header img{width:52px;height:52px;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
h1{font-size:1.7rem;line-height:1.1;margin:0;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
#snd{margin-left:auto;background:var(--card);border:1px solid var(--bd);width:42px;height:42px;font-size:1.1rem;border-radius:12px;color:var(--fg)}
.stage{position:relative;width:100%;max-width:380px;margin:8px auto 0}
canvas#c{width:100%;height:auto;aspect-ratio:1;display:block;filter:drop-shadow(0 12px 28px rgba(0,0,0,.4))}
.pointer{position:absolute;top:-10px;left:50%;width:34px;height:42px;margin-left:-17px;transform-origin:50% 8px;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.pointer svg{display:block}
.pointer.t{animation:tk .11s ease-out}
@keyframes tk{40%{transform:rotate(-16deg)}}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#spin{display:block;width:100%;max-width:380px;margin:22px auto;background:var(--ac);color:#fff;font-weight:800;font-size:1.3rem;letter-spacing:.02em;padding:16px;box-shadow:0 5px 0 #9f1239}
#spin:disabled{opacity:.45}
#spin:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #9f1239}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-top:14px}
.card h2{font-size:1rem;margin:0 0 10px}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
form button{background:var(--fg);color:var(--bg);padding:0 20px;font-weight:800;font-size:1.3rem}
ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chips li{display:flex;align-items:center;gap:4px;padding:5px 5px 5px 12px;border-radius:999px;color:#fff;font-weight:700;font-size:.92rem}
.chips li button{background:rgba(0,0,0,.28);color:#fff;width:24px;height:24px;border-radius:50%;padding:0;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:.9rem;color:var(--mut)}
.row button{background:none;color:var(--mut);text-decoration:underline;padding:6px}
label.sw{display:flex;align-items:center;gap:8px;cursor:pointer}
label.sw input{width:20px;height:20px;accent-color:var(--ac)}
.hist li{background:var(--bg);border:1px solid var(--bd);padding:5px 12px;border-radius:10px;font-size:.9rem}
.hist li:first-child{border-color:var(--ac);font-weight:700}
.empty{color:var(--mut);font-size:.9rem;margin:0}
#res{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}
#res.on{display:flex}
#res .box{background:var(--card);border-radius:24px;padding:30px 24px;max-width:340px;width:100%;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
#res .big{font-size:2.5rem;font-weight:900;line-height:1.1;word-break:break-word;margin:8px 0 22px;letter-spacing:-.02em}
#res button{background:var(--ac);color:#fff;padding:13px 30px;font-weight:800}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pointer.t,#res .box{animation:none}}
</style>
</head>

<div class="row"><label class="sw"><input type="checkbox" id="elim">Gewinner danach entfernen</label><span><button id="sh">Mischen</button><button id="clr">Leeren</button></span></div>
</section>
<section class="card">
<h2>Letzte Ergebnisse</h2>
<ul class="hist" id="hist"></ul>
<p class="empty" id="he">Noch nichts gedreht.</p>
<div class="row"><span></span><button id="hc">Verlauf löschen</button></div>
</section>
</main>
<div id="res"><div class="box"><div>Das Rad entscheidet:</div><div class="big" id="win"></div><button id="ok">Weiter</button></div></div>
<canvas id="cf"></canvas>
<script>
const $=id=>document.getElementById(id);
const COL=["#f43f5e","#f59e0b","#10b981","#3b82f6","#a855f7","#ec4899","#14b8a6","#f97316"];
const cv=$("c"),ctx=cv.getContext("2d");
let names=[],hist=[],angle=0,spinning=false,snd=true,elim=false,last=-1,ac,winIdx=-1;
function ld(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
names=ld("w2-names",["Anna","Ben","Chris"]);if(!Array.isArray(names))names=[];
hist=ld("w2-hist",[]);if(!Array.isArray(hist))hist=[];
snd=ld("w2-snd",true);elim=ld("w2-elim",false);
function beep(f,d,v,t){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t||"triangle";o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
function draw(){
 const d=window.devicePixelRatio||1,w=cv.clientWidth||340;
 cv.width=cv.height=Math.round(w*d);ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,w);
 const r=w/2,n=names.length,R=r-10;
 ctx.beginPath();ctx.arc(r,r,r-2,0,7);ctx.fillStyle="#fafafa";ctx.fill();
 if(n<2){ctx.beginPath();ctx.arc(r,r,R,0,7);ctx.fillStyle="#3f3f46";ctx.fill();ctx.fillStyle="#fafafa";ctx.font="700 18px system-ui";ctx.textAlign="center";ctx.fillText("Mindestens 2 Namen nötig",r,r+6);return}
 const s=2*Math.PI/n;
 for(let i=0;i<n;i++){
  const a=angle+i*s;ctx.beginPath();ctx.moveTo(r,r);ctx.arc(r,r,R,a,a+s);ctx.closePath();
  ctx.fillStyle=COL[i%COL.length];if(n%COL.length===1&&i===n-1)ctx.fillStyle="#64748b";ctx.fill();
  ctx.strokeStyle="rgba(255,255,255,.55)";ctx.lineWidth=1.5;ctx.stroke();
  ctx.save();ctx.translate(r,r);ctx.rotate(a+s/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=3;
  ctx.font="800 "+Math.max(12,Math.min(21,w/(n>8?20:13)))+"px 'Trebuchet MS',system-ui";
  let t=names[i];if(t.length>12)t=t.slice(0,11)+"…";
  ctx.fillText(t,R-16,6);ctx.restore();
 }
 for(let i=0;i<n;i++){const a=angle+i*s;ctx.beginPath();ctx.arc(r+(r-5)*Math.cos(a),r+(r-5)*Math.sin(a),3,0,7);ctx.fillStyle="#f43f5e";ctx.fill()}
 ctx.beginPath();ctx.arc(r,r,22,0,7);ctx.fillStyle="#fafafa";ctx.fill();ctx.lineWidth=3;ctx.strokeStyle="#18181b";ctx.stroke();
}
function render(){
 const ul=$("list");ul.innerHTML="";
 names.forEach((t,i)=>{const li=document.createElement("li");li.style.background=COL[i%COL.length];li.append(t);
  const b=document.createElement("button");b.textContent="×";b.setAttribute("aria-label",t+" entfernen");
  b.onclick=()=>{if(spinning)return;names.splice(i,1);sv("w2-names",names);render()};li.append(b);ul.append(li)});
 const h=$("hist");h.innerHTML="";hist.slice(0,6).forEach(t=>{const li=document.createElement("li");li.textContent=t;h.append(li)});
 $("he").style.display=hist.length?"none":"block";
 $("spin").disabled=names.length<2||spinning;$("snd").textContent=snd?"🔊":"🔇";$("elim").checked=elim;
 draw();
}
function idxAt(a){const n=names.length,s=2*Math.PI/n;const rel=((-Math.PI/2-a)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);return Math.floor(rel/s)%n}
$("f").onsubmit=e=>{e.preventDefault();const i=$("n"),v=i.value.trim();
 if(v&&names.length<24&&!spinning){names.push(v);i.value="";sv("w2-names",names);render()}i.focus()};
$("clr").onclick=()=>{if(!spinning){names=[];sv("w2-names",names);render()}};
$("sh").onclick=()=>{if(spinning)return;for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]]}sv("w2-names",names);render()};
$("hc").onclick=()=>{hist=[];sv("w2-hist",hist);render()};
$("snd").onclick=()=>{snd=!snd;sv("w2-snd",snd);render();beep(660,.08,.1)};
$("elim").onchange=e=>{elim=e.target.checked;sv("w2-elim",elim)};
$("spin").onclick=()=>{
 if(spinning||names.length<2)return;spinning=true;render();beep(440,.05,.001);
 try{ac&&ac.state==="suspended"&&ac.resume()}catch(e){}
 const start=angle,total=(7+Math.random()*4)*2*Math.PI,dur=5800,t0=performance.now();last=idxAt(angle);
 (function step(t){
  const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);angle=start+total*e;draw();
  const c=idxAt(angle);if(c!==last){last=c;beep(620+Math.random()*120,.05,.09);const pt=$("ptr");pt.classList.remove("t");void pt.offsetWidth;pt.classList.add("t")}
  if(p<1)requestAnimationFrame(step);else done();
 })(t0);
};
function done(){
 spinning=false;winIdx=idxAt(angle);const w=names[winIdx];
 hist.unshift(w);hist=hist.slice(0,20);sv("w2-hist",hist);
 $("win").textContent=w;$("win").style.color=COL[winIdx%COL.length];$("res").classList.add("on");
 [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25,.12,"sine"),i*110));
 try{navigator.vibrate&&navigator.vibrate([80,40,160])}catch(e){}
 confetti();render();
}
$("ok").onclick=()=>{$("res").classList.remove("on");
 if(elim&&names.length>2&&winIdx>=0){names.splice(winIdx,1);sv("w2-names",names)}winIdx=-1;render()};
function confetti(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const c=$("cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:130},()=>({x:c.width/2,y:c.height*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:5+Math.random()*7,r:Math.random()*6,c:COL[Math.floor(Math.random()*COL.length)]}));
 let f=0;(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
  if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})();
}
addEventListener("resize",draw);
render();
</script>
</body>
</html>
